<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prácticas parcial 2</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e8edf7;
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: clamp(1.75rem, 7vw, 2.5rem);
      margin: 0 0 8px;
    }

    p {
      margin: 0 0 32px;
      color: #93a3bd;
    }

    .botones {
      display: grid;
      gap: 14px;
    }

    a {
      display: block;
      padding: 16px 20px;
      border-radius: 12px;
      background: #1d2a44;
      border: 1px solid #2c3d61;
      color: #e8edf7;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: background .15s, transform .15s;
    }

    a:hover, a:focus-visible {
      background: #2a3c61;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main>
    <h1>Prácticas parcial 2</h1>
    <p>Gabriel Gamboa</p>

    <div class="botones">
      <a href="https://gabrielgamboapad-svg.github.io/practica-event-listeners/">Práctica Event Listeners</a>
      <a href="https://gabrielgamboapad-svg.github.io/todo-app/">Todo App</a>
      <a href="https://gabrielgamboapad-svg.github.io/Galeria-de-imagenes/">Galería de imágenes</a>
    </div>
  </main>
</body>
</html>
